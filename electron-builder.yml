appId: com.studygit.app
productName: Studygit
copyright: Copyright (c) 2026 Studygit

directories:
  buildResources: electron/build
  output: release

# What lives inside the package.
#
# The shell is a thin wrapper around the hosted Vercel deployment.
# Every web-side npm dep (Tiptap, pdfjs-dist, mupdf, Next, the AWS S3
# client, etc.) belongs on Vercel and would otherwise bloat the asar
# from ~10 MB to 400+ MB.
#
# We can't trim those via `files` alone — electron-builder runs an
# independent production-dependency walker over package.json. The
# slimming is done in `scripts/electron-prepack.mjs` (invoked by
# `electron:build`), which writes a temporary package.json containing
# only `electron-updater` for the duration of the packaging step. The
# real package.json is restored afterwards so the web build is
# unaffected.
files:
  - "electron/dist/**/*"
  - "electron/splash.html"
  - "electron/build/icon.png"
  - "package.json"
  - "!**/.git/**"
  - "!**/.next/**"
  - "!.env*"
  - "!data/**"
  - "!.electron-userdata-dev/**"
  - "!release/**"
  - "!supabase/**"
  - "!scripts/**"
  - "!**/*.md"
  - "!**/*.tsbuildinfo"
  - "!**/tsconfig*.json"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples,coverage,docs}/**"
  - "!**/node_modules/*/{*.d.ts,*.map,LICENSE*,CHANGELOG*,HISTORY*}"

asar: true
asarUnpack:
  # Electron <webview preload="…"> only accepts file:// URLs; preloads
  # inside an asar archive are rejected. Unpack the in-app browser's
  # selection/highlight preload so Chromium can load it directly.
  - "electron/dist/webview-preload.js"
  - "electron/dist/webview-preload.js.map"

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip      # required by electron-updater on macOS (Squirrel.Mac)
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/build/entitlements.mac.plist
  entitlementsInherit: electron/build/entitlements.mac.plist
  # Notarization is gated on the env vars APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID being present in the
  # build env; electron-builder discovers them automatically.
  notarize: false

dmg:
  writeUpdateInfo: false

win:
  # NSIS is the only target we ship: electron-updater on Windows
  # consumes the .exe + its blockmap from latest.yml. A `zip` target
  # was previously listed for portable installs, but on Windows
  # runners 7zip races with npm's atomic-install temp directories
  # (e.g. node_modules/<pkg>-<16hex>/) that briefly exist inside the
  # standalone bundle, exits 1 on a "cannot open file" warning, and
  # fails the build even though the archive itself is fine. If you
  # need a portable build later, re-add `- target: zip` and add a
  # cleanup step that prunes node_modules/*-[0-9a-f]{16}* before
  # `electron-builder` runs.
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  category: Office
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

# electron-updater reads latest.yml / latest-mac.yml / latest-linux.yml
# alongside the binaries on the configured channel. `npm run release`
# (electron-builder --publish always) requires GH_TOKEN with repo scope.
# Local `npm run dist*` runs skip publishing entirely.
publish:
  - provider: github
    releaseType: release

