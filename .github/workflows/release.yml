# Continuous release: every push to `main` produces a new desktop
# release and ships it to existing installs via electron-updater.
#
# How it works:
#   1. The `bump` job picks a new semver, commits the bump back to
#      `main`, and exposes the version to downstream jobs.
#        - default                    → patch  (0.2.1 → 0.2.2)
#        - commit msg [release-minor] → minor  (0.2.1 → 0.3.0)
#        - commit msg [release-major] → major  (0.2.1 → 1.0.0)
#        - commit msg [skip release]  → no release this push
#        - workflow_dispatch          → choose patch / minor / major
#   2. The `build` matrix runs in parallel on macOS + Windows runners,
#      builds installers, and `electron-builder --publish always`
#      creates the GitHub Release `vX.Y.Z` and uploads assets +
#      latest.yml / latest-mac.yml manifests. Existing installs poll
#      every 6h and on launch; updates land automatically.
#
# Loop safety:
#   - The bump commit is authored as `chore(release): vX.Y.Z [skip
#     release]`. The `bump` job's `if:` skips that exact pattern so it
#     can never re-bump itself.
#   - GitHub also won't fire workflows for pushes made by
#     `GITHUB_TOKEN` by default, so the [skip release] marker is
#     belt-and-suspenders.
#
# Version-drift safety:
#   - The tag and GitHub Release are created at PUBLISH time by
#     electron-builder (not before the build starts). If the build
#     fails, no tag is left dangling — the next push just bumps from
#     the last successful release.
#   - The bump commit IS pushed to `main` regardless of build outcome
#     (otherwise we'd retry the same version on the next push and
#     electron-updater would silently ignore it). On a build failure,
#     the next successful build picks up wherever main is.
#
# Required secrets:
#   GITHUB_TOKEN  — auto-provided to workflows; needs `contents: write`
#                   (set below in `permissions`). No PAT needed.
#
# Optional secrets (enable code-signing & notarization when ready):
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#                   — flip `mac.notarize: true` in electron-builder.yml
#                     once these are set.
#   CSC_LINK        — base64-encoded .p12 (mac Developer ID Application
#                     or Windows code-signing cert). When `CSC_LINK`
#                     starts with a path or URL electron-builder reads
#                     it directly; for a base64 blob, decode it to a
#                     file in a prior step and point CSC_LINK at it.
#   CSC_KEY_PASSWORD — password for the .p12.
#
# Important: GitHub Actions substitutes missing secrets with empty
# strings. Passing CSC_LINK="" breaks electron-builder (it treats the
# value like a path and fails with "<workspace> not a file"). The job
# below maps *_INPUT aliases onto CSC_* only when those secrets exist.
#
# Until those are wired, builds are unsigned. macOS users will need to
# clear the quarantine flag once after install (the landing page
# documents this). Windows users will see a SmartScreen prompt the
# first time.

name: release

on:
  push:
    branches: [main]
    # Doc-only and meta changes shouldn't ship a 300 MB installer to
    # every user. Touching anything else (incl. .github/workflows/**)
    # does trigger a release — that's how we test changes to the
    # pipeline itself end-to-end.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

# Serialize releases. If two pushes land in quick succession, the
# second waits for the first to finish (rather than cancelling) —
# half-uploaded GitHub Release assets would confuse electron-updater.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    # Don't recurse on the bump's own push, and respect explicit opt-
    # out. `head_commit.message` is null for workflow_dispatch, in
    # which case both contains() return false → we proceed.
    if: |
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, 'chore(release):')
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need write access to push the bump commit back; default
          # GITHUB_TOKEN works because permissions.contents: write is
          # set above.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Determine bump type
        id: type
        shell: bash
        env:
          DISPATCH_INPUT: ${{ inputs.bump_type }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -n "${DISPATCH_INPUT:-}" ]; then
            echo "type=${DISPATCH_INPUT}" >> "$GITHUB_OUTPUT"
            echo "Triggered by workflow_dispatch: ${DISPATCH_INPUT}"
            exit 0
          fi
          if printf '%s' "${COMMIT_MSG}" | grep -qiE '\[release[ -]major\]'; then
            BUMP=major
          elif printf '%s' "${COMMIT_MSG}" | grep -qiE '\[release[ -]minor\]'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          echo "type=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "Inferred from commit message: ${BUMP}"

      - name: Bump and push
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `--no-git-tag-version` updates package.json + package-lock.json
          # but leaves tagging to electron-builder at publish time.
          npm version ${{ steps.type.outputs.type }} --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"

          git add package.json package-lock.json
          git commit -m "chore(release): v${VERSION} [skip release]"
          git push origin HEAD:main

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release queued::Version bumped to v${VERSION}; build matrix will publish it shortly."

  build:
    name: build (${{ matrix.os }})
    needs: bump
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Don't abort the Windows build if Mac fails (or vice versa). Each
      # platform's artifacts are independently useful.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # macos-latest runners are arm64; electron-builder cross-
            # compiles the x64 dmg from the same job per the
            # `arch: [x64, arm64]` config in electron-builder.yml.
            builder_flag: "--mac"
          - os: windows-latest
            builder_flag: "--win"

    steps:
      - name: Checkout (post-bump)
        uses: actions/checkout@v5
        with:
          # Pull the bumped commit, not the original trigger SHA, so
          # package.json reflects the version we're about to publish.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # `npm ci` runs the postinstall hook which calls electron-
        # rebuild for @mongodb-js/zstd against Electron's Node ABI on
        # the runner. That's needed for the native zstd addon to load
        # inside the packaged app.
        run: npm ci

      - name: Build Next.js + Electron bundle
        # `npm run electron:build` does, in order:
        #   1. scripts/prune-npm-temp-dirs.mjs   — clear stray
        #      `<pkg>-<16hex>/` entries left over from npm's atomic
        #      install (otherwise Turbopack bakes the temp-dir name
        #      into the compiled chunks and the packaged app 500s on
        #      every request — this is the v0.2.3 macOS regression).
        #   2. next build                         — produces
        #      .next/standalone (forked by electron/main.ts at
        #      runtime).
        #   3. scripts/check-bundle-for-temp-dir-refs.mjs — scan the
        #      compiled chunks for any leaked `-<16hex>` references
        #      and fail the build before publish if any survived.
        #   4. electron/postbuild.mjs             — copy static/public
        #      into the standalone tree, prune any temp entries that
        #      slipped into .next/standalone/.
        #   5. tsc -p electron/                   — compile the
        #      Electron main + preload TS.
        run: npm run electron:build
        env:
          # Default persistence layer for the desktop build is local
          # files; making this explicit keeps any stray Supabase env
          # vars in the runner from changing build behaviour.
          PERSISTENCE: file

      - name: Verify Electron runtime deps are not in devDependencies
        # Static check: every package require()d by electron/dist/{main,
        # preload}.js must be declared in package.json `dependencies`.
        # electron-builder prunes devDependencies from the packaged app,
        # so a misplaced runtime dep results in "Cannot find module ..."
        # at first launch (this is exactly the v0.2.0 incident with
        # electron-updater). Failing here costs seconds; failing in
        # production costs a recall.
        shell: bash
        run: node scripts/check-electron-runtime-deps.mjs

      - name: Package and publish installers
        # `electron-builder --publish always` creates the GitHub
        # release `v${{ needs.bump.outputs.version }}` (or appends to
        # one another runner just created), uploads the binaries +
        # latest.yml manifests, and publishes it. Per
        # electron-builder.yml, releaseType is `release` (not `draft`),
        # so the release goes live as soon as the second runner
        # finishes.
        shell: bash
        env:
          # electron-builder reads GH_TOKEN for GitHub publishing; the
          # workflow-scoped GITHUB_TOKEN already has contents:write.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never set CSC_* / APPLE_* directly from secrets — missing
          # secrets become "" and electron-builder mis-handles empty
          # CSC_LINK (repo root "not a file"). Copy through bash below.
          CSC_LINK_INPUT: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_INPUT: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_INPUT: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_INPUT: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_INPUT: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${CSC_LINK_INPUT:-}" ]]; then
            export CSC_LINK="$CSC_LINK_INPUT"
          fi
          if [[ -n "${CSC_KEY_PASSWORD_INPUT:-}" ]]; then
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_INPUT"
          fi
          if [[ -n "${APPLE_ID_INPUT:-}" ]]; then
            export APPLE_ID="$APPLE_ID_INPUT"
          fi
          if [[ -n "${APPLE_APP_SPECIFIC_PASSWORD_INPUT:-}" ]]; then
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_INPUT"
          fi
          if [[ -n "${APPLE_TEAM_ID_INPUT:-}" ]]; then
            export APPLE_TEAM_ID="$APPLE_TEAM_ID_INPUT"
          fi
          npx --no-install electron-builder ${{ matrix.builder_flag }} --publish always
